<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINZ STORE - Đặt Hàng Nhanh</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary-color: #ffc107; --dark-bg: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f4; }
        .navbar { background-color: var(--dark-bg) !important; border-bottom: 2px solid var(--primary-color); }
        .navbar-brand { color: white !important; font-weight: bold; }
        .hero-banner { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1555616635-640b71bdb181?auto=format&fit=crop&w=1350&q=80'); background-size: cover; padding: 100px 0; color: white; text-align: center; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; transition: 0.3s; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .product-card:hover { transform: translateY(-10px); }
        .product-img { width: 100%; height: 230px; object-fit: cover; }
        .price-tag { color: #d9534f; font-weight: bold; font-size: 1.2rem; }
        .btn-buy { background-color: var(--dark-bg); color: white; border-radius: 25px; font-weight: bold; }
        .btn-buy:hover { background-color: var(--primary-color); color: black; }
        /* Nút gọi nhanh */
        .zalo-float { position: fixed; bottom: 20px; right: 20px; background-color: #0084ff; color: white; border-radius: 50%; width: 60px; height: 60px; text-align: center; line-height: 60px; font-size: 30px; z-index: 1000; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">SHINZ <span style="color:var(--primary-color)">STORE</span></a>
        </div>
    </nav>

    <header class="hero-banner">
        <div class="container">
            <h1>PREMIUM VAPE STORE</h1>
            <p>Hệ thống đặt hàng online nhanh chóng</p>
        </div>
    </header>

    <div class="container my-5">
        <h2 class="text-center mb-5 fw-bold">DANH SÁCH SẢN PHẨM</h2>
        <div class="row g-4">
            
            <div class="col-md-3">
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1512036666432-2181c1f26420?auto=format&fit=crop&w=500&q=60" class="product-img">
                    <div class="p-3 text-center">
                        <h5>Pod System X1</h5>
                        <p class="price-tag">450.000đ</p>
                        <button class="btn btn-buy w-100" data-bs-toggle="modal" data-bs-target="#orderModal" data-product="Pod System X1">MUA NGAY</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1527010154944-f2241763d806?auto=format&fit=crop&w=500&q=60" class="product-img">
                    <div class="p-3 text-center">
                        <h5>Juice Fruity Mix</h5>
                        <p class="price-tag">320.000đ</p>
                        <button class="btn btn-buy w-100" data-bs-toggle="modal" data-bs-target="#orderModal" data-product="Juice Fruity Mix">MUA NGAY</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1550581190-9c1c48d21d6c?auto=format&fit=crop&w=500&q=60" class="product-img">
                    <div class="p-3 text-center">
                        <h5>Accessory Pro</h5>
                        <p class="price-tag">150.000đ</p>
                        <button class="btn btn-buy w-100" data-bs-toggle="modal" data-bs-target="#orderModal" data-product="Accessory Pro">MUA NGAY</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Thông Tin Đặt Hàng</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="orderForm">
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Sản phẩm chọn:</label>
                            <input type="text" class="form-control bg-light" id="productName" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Họ và Tên:</label>
                            <input type="text" class="form-control" placeholder="Nhập tên của bạn" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại:</label>
                            <input type="tel" class="form-control" placeholder="Nhập số điện thoại" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ nhận hàng:</label>
                            <textarea class="form-control" rows="2" placeholder="Số nhà, tên đường, phường/xã..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold">XÁC NHẬN ĐẶT HÀNG</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0">&copy; 2026 SHINZ19.github.io - Đồ án hoàn tất</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Đoạn code xử lý việc hiện tên sản phẩm vào Form
        const orderModal = document.getElementById('orderModal');
        orderModal.addEventListener('show.bs.modal', event => {
            const button = event.relatedTarget;
            const product = button.getAttribute('data-product');
            const modalInput = orderModal.querySelector('#productName');
            modalInput.value = product;
        });

        // Xử lý khi nhấn nút Xác nhận
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Cảm ơn bạn! Đơn hàng đã được ghi nhận. Chúng tôi sẽ liên hệ sớm nhất.');
            location.reload(); // Tải lại trang
        });
    </script>
</body>
</html>
