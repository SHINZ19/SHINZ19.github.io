<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINZ PC - Hi-End Gaming Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #00d2ff; --dark: #0d0d0d; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; }
        
        /* THANH TOP BAR LIÊN HỆ */
        .top-bar { background: #1a1a1a; color: white; font-size: 0.85rem; padding: 10px 0; border-bottom: 1px solid #333; }
        .top-logo { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--primary); margin-right: 10px; }
        
        /* NAVBAR CHÍNH */
        .navbar { background: var(--dark) !important; border-bottom: 2px solid var(--primary); padding: 12px 0; }
        .logo-z { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary); margin-right: 12px; }
        .search-box { max-width: 400px; width: 100%; margin: 0 20px; }
        .search-input { border-radius: 20px 0 0 20px; border: none; }
        .btn-search { border-radius: 0 20px 20px 0; background: var(--primary); color: #000; font-weight: bold; border: none; }
        
        /* CATEGORY BAR */
        .category-bar { background: #1a1a1a; padding: 12px 0; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #333; }
        .cat-btn { color: white; border: 1px solid #444; border-radius: 20px; margin: 0 5px; padding: 6px 18px; transition: 0.3s; font-size: 0.9rem; }
        .cat-btn.active, .cat-btn:hover { background: var(--primary); color: black; border-color: var(--primary); font-weight: bold; }

        /* PRODUCT CARD */
        .pc-card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s; height: 100%; background: white; }
        .pc-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,210,255,0.2); }
        .price { color: #ff4757; font-weight: bold; font-size: 1.1rem; }
        .btn-buy { background: var(--primary); color: black; font-weight: bold; border: none; width: 100%; border-radius: 8px; padding: 10px; transition: 0.3s; }
        .btn-buy:hover { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
    </style>
</head>
<body>

    <div class="top-bar d-none d-lg-block">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <img src="logo.jpg" alt="Logo" class="top-logo">
                <span class="me-4"><i class="fas fa-phone-alt text-info"></i> Hotline: <b>0392966091</b></span>
                <span class="me-4"><i class="fas fa-clock text-info"></i> Mở cửa: <b>7:00 - 22:00</b></span>
            </div>
            <div>
                <i class="fas fa-map-marker-alt text-info"></i> Địa chỉ: <b>Khu vực Thới Hòa 1, Thới Thuận, Thốt Nốt, Cần Thơ</b>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center text-white" href="#">
                <img src="logo.jpg" class="logo-z"> <span class="fw-bold">SHINZ PC</span>
            </a>
            <div class="search-box d-flex mx-auto">
                <input type="text" id="searchInput" class="form-control search-input" placeholder="Tìm sản phẩm RTX, ASUS, I9...">
                <button class="btn btn-search"><i class="fas fa-search"></i></button>
            </div>
            <div class="text-white ms-3 d-flex align-items-center">
                <div class="position-relative me-3">
                    <i class="fas fa-shopping-basket fa-lg"></i>
                    <span id="cart-count" class="badge bg-danger rounded-circle position-absolute top-0 start-100 translate-middle">0</span>
                </div>
                <i class="fas fa-user-circle fa-lg"></i>
            </div>
        </div>
    </nav>

    <div class="category-bar">
        <div class="container text-center">
            <button class="btn cat-btn active" onclick="filter('all')">Tất cả</button>
            <button class="btn cat-btn" onclick="filter('vga')">VGA RTX (30)</button>
            <button class="btn cat-btn" onclick="filter('monitor')">Màn ASUS (30)</button>
            <button class="btn cat-btn" onclick="filter('gear')">Phím & Chuột (30)</button>
            <button class="btn cat-btn" onclick="filter('cpu')">Intel Core (30)</button>
        </div>
    </div>

    <div class="container my-5">
        <h3 id="catTitle" class="fw-bold mb-4 text-dark text-uppercase">Tất cả sản phẩm (120)</h3>
        <div class="row g-4 text-center" id="displayGrid"></div>
    </div>

    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0 small text-muted">© 2026 SHINZ PC - Hi-End Gaming Center | Cần Thơ</p>
    </footer>

    <script>
        const data = [];

        // 1. THÊM 30 VGA RTX (Dòng RTX 30 & 40)
        const vgaModels = ["RTX 3050", "RTX 3060", "RTX 3060 Ti", "RTX 3070", "RTX 3070 Ti", "RTX 3080", "RTX 3090", "RTX 4060", "RTX 4060 Ti", "RTX 4070", "RTX 4070 Super", "RTX 4070 Ti", "RTX 4080", "RTX 4080 Super", "RTX 4090"];
        for(let i=1; i<=30; i++) {
            let model = vgaModels[i % vgaModels.length];
            data.push({ cat: 'vga', name: `VGA NVIDIA ${model} ${i % 2 == 0 ? 'ROG Strix' : 'TUF Gaming'} OC Edition`, price: `${(i+5)*1.2}.990.000đ`, img: 'https://via.placeholder.com/200x160/000/00d2ff?text='+model });
        }

        // 2. THÊM 30 MÀN HÌNH ASUS (Cong, 120Hz - 540Hz, Aim tường)
        const hzList = [120, 144, 165, 180, 240, 280, 360, 500, 540];
        for(let i=1; i<=30; i++) {
            let hz = hzList[i % hzList.length];
            data.push({ cat: 'monitor', name: `Màn hình ASUS ${i%2==0?'ROG Swift':'TUF'} ${24+i%10}" ${hz}Hz ${i%5==0?'Cong':'Phẳng'} G-Sync`, price: `${i+2}.500.000đ`, img: 'https://via.placeholder.com/200x160/1a1a1a/00d2ff?text='+hz+'Hz' });
        }

        // 3. THÊM 30 PHÍM & CHUỘT (Logitech, ATK, Không dây/Có dây)
        for(let i=1; i<=30; i++) {
            let type = i % 2 == 0 ? "Chuột Wireless" : "Bàn phím cơ TKL";
            let brand = i % 3 == 0 ? "Logitech G" : (i % 3 == 1 ? "ATK" : "Razer");
            data.push({ cat: 'gear', name: `${brand} ${type} ${i % 2 == 0 ? 'PRO X' : 'Custom RGB'}`, price: `${(i*150)+200}.000đ`, img: 'https://via.placeholder.com/200x160/000/00d2ff?text='+brand });
        }

        // 4. THÊM 30 CPU INTEL (i3 - i9)
        const cpuTypes = ["i3-12100", "i3-13100", "i5-12400", "i5-13400", "i5-13600K", "i5-14600K", "i7-12700", "i7-13700K", "i7-14700K", "i9-12900K", "i9-13900K", "i9-14900K", "i9-14900KS"];
        for(let i=1; i<=30; i++) {
            let cpu = cpuTypes[i % cpuTypes.length];
            data.push({ cat: 'cpu', name: `CPU Intel Core ${cpu} ${i%2==0?'Box':'Tray'} Chính Hãng`, price: `${(i*0.5)+2}.900.000đ`, img: 'https://via.placeholder.com/200x160/1a1a1a/00d2ff?text='+cpu });
        }

        function render(items) {
            const grid = document.getElementById('displayGrid');
            grid.innerHTML = items.map(p => `
                <div class="col-6 col-md-3 mb-2">
                    <div class="card pc-card p-2 text-center">
                        <img src="${p.img}" class="card-img-top rounded mb-2">
                        <div class="card-body p-1">
                            <h6 class="fw-bold" style="font-size:0.8rem; height:40px; overflow:hidden">${p.name}</h6>
                            <p class="price mb-2">${p.price}</p>
                            <button class="btn btn-buy btn-sm" onclick="addCart()">THÊM GIỎ HÀNG</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filter(c) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            const res = c === 'all' ? data : data.filter(p => p.cat === c);
            render(res);
            document.getElementById('catTitle').innerText = (c === 'all' ? 'Tất cả sản phẩm (120)' : c);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            render(data.filter(p => p.name.toLowerCase().includes(val)));
        });

        let cart = 0;
        function addCart() { cart++; document.getElementById('cart-count').innerText = cart; alert("Đã thêm vào giỏ hàng!"); }

        render(data);
    </script>
</body>
</html>
