<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINZ PC - Hi-End Computer Store</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { 
            --primary-color: #00d2ff; /* Màu xanh Cyan giống banner */
            --dark-bg: #0a0a0a; 
            --accent-color: #0080ff;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; }
        
        /* Navbar chuyên nghiệp */
        .navbar { background-color: var(--dark-bg) !important; border-bottom: 2px solid var(--primary-color); }
        .navbar-brand { color: white !important; font-weight: 800; letter-spacing: 1px; }
        .navbar-brand span { color: var(--primary-color); }

        /* BANNER SHINZ PC MỚI */
        .hero-banner { 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1593640408182-31c70c8268f5?auto=format&fit=crop&w=1920&q=80'); 
            background-size: cover; 
            background-position: center;
            padding: 130px 0; 
            color: white; 
            text-align: center; 
            border-bottom: 5px solid var(--primary-color);
        }
        .hero-banner h1 { 
            font-size: 4.5rem; 
            font-weight: 900; 
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow: 0 0 20px var(--primary-color);
            margin-bottom: 10px;
        }
        .hero-banner p { font-size: 1.5rem; font-weight: 300; opacity: 0.9; }

        /* Card sản phẩm Gaming */
        .product-card { 
            background: white; 
            border-radius: 15px; 
            overflow: hidden; 
            transition: 0.4s; 
            border: 1px solid #eee; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
        }
        .product-card:hover { transform: translateY(-12px); border-color: var(--primary-color); box-shadow: 0 10px 25px rgba(0,210,255,0.2); }
        .product-img { width: 100%; height: 220px; object-fit: cover; }
        .price-tag { color: #ff4757; font-weight: bold; font-size: 1.3rem; }
        
        .btn-buy { 
            background-color: var(--dark-bg); 
            color: white; 
            border-radius: 8px; 
            font-weight: bold; 
            border: 2px solid var(--dark-bg);
            transition: 0.3s;
        }
        .btn-buy:hover { background-color: transparent; color: var(--dark-bg); border-color: var(--primary-color); }
        
        .zalo-float { position: fixed; bottom: 20px; right: 20px; background-color: #0084ff; color: white; border-radius: 50%; width: 60px; height: 60px; text-align: center; line-height: 60px; font-size: 30px; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">SHINZ <span>PC</span></a>
        </div>
    </nav>

    <header class="hero-banner">
        <div class="container">
            <h1 class="animate__animated animate__fadeInDown">SHINZ PC</h1>
            <p>COMPONENTS & GAMING GEAR ACCESSORIES</p>
            <a href="#sanpham" class="btn btn-primary btn-lg mt-4 px-5 rounded-pill fw-bold" style="background-color: var(--primary-color); border:none; color:black;">MUA NGAY</a>
        </div>
    </header>

    <div class="container my-5" id="sanpham">
        <h2 class="text-center mb-5 fw-bold">LINH KIỆN NỔI BẬT</h2>
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1591488320449-011701bb6704?auto=format&fit=crop&w=500&q=60" class="product-img">
                    <div class="p-3 text-center">
                        <h5>Mainboard Gaming Z790</h5>
                        <p class="price-tag">8.450.000đ</p>
                        <button class="btn btn-buy w-100" data-bs-toggle="modal" data-bs-target="#orderModal" data-product="Mainboard Gaming Z790">ĐẶT HÀNG</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=500&q=60" class="product-img">
                    <div class="p-3 text-center">
                        <h5>VGA RTX 4070 Ti</h5>
                        <p class="price-tag">22.320.000đ</p>
                        <button class="btn btn-buy w-100" data-bs-toggle="modal" data-bs-target="#orderModal" data-product="VGA RTX 4070 Ti">ĐẶT HÀNG</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=500&q=60" class="product-img">
                    <div class="p-3 text-center">
                        <h5>Bàn phím Cơ RGB</h5>
                        <p class="price-tag">1.150.000đ</p>
                        <button class="btn btn-buy w-100" data-bs-toggle="modal" data-bs-target="#orderModal" data-product="Bàn phím Cơ RGB">ĐẶT HÀNG</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Xác Nhận Đặt Hàng PC</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="orderForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-primary">Linh kiện đã chọn:</label>
                            <input type="text" class="form-control bg-light fw-bold" id="productName" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Họ tên khách hàng:</label>
                            <input type="text" class="form-control" placeholder="Nguyễn Văn A" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại:</label>
                            <input type="tel" class="form-control" placeholder="090x xxx xxx" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold" style="background-color: var(--primary-color); border:none; color:black;">XÁC NHẬN MUA</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0 text-muted">&copy; 2026 SHINZ PC - Build Your Dream PC</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const orderModal = document.getElementById('orderModal');
        orderModal.addEventListener('show.bs.modal', event => {
            const button = event.relatedTarget;
            const product = button.getAttribute('data-product');
            const modalInput = orderModal.querySelector('#productName');
            modalInput.value = product;
        });

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Chúc mừng! Đơn hàng linh kiện PC của bạn đã được gửi đi thành công.');
            location.reload();
        });
    </script>
</body>
</html>
