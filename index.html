<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINZ PC - Hi-End Gaming Store</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary-color: #00d2ff; --dark-bg: #0d0d0d; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        
        /* THANH THÔNG TIN LIÊN HỆ TRÊN CÙNG (TOP BAR) */
        .top-bar { 
            background-color: #1a1a1a; 
            color: white; 
            font-size: 0.85rem; 
            padding: 8px 0; 
            border-bottom: 1px solid #333;
        }
        .top-bar i { color: var(--primary-color); margin-right: 5px; }
        .top-logo-small { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--primary-color); margin-right: 10px; }

        /* NAVBAR CHÍNH */
        .navbar { 
            background-color: var(--dark-bg) !important; 
            border-bottom: 2px solid var(--primary-color); 
            padding: 10px 0; 
        }
        .navbar-brand { 
            color: white !important; 
            font-weight: 800; 
            font-size: 1.6rem; 
            display: flex;
            align-items: center;
        }
        
        /* Logo tròn Z của bạn */
        .logo-z-tech { 
            width: 45px; 
            height: 45px; 
            border: 2px solid var(--primary-color); 
            border-radius: 50%;
            object-fit: cover; 
            margin-right: 12px; 
        }

        /* Thanh tìm kiếm */
        .search-container { max-width: 350px; width: 100%; margin: 0 20px; }
        .search-input { border-radius: 20px 0 0 20px; border: none; padding: 8px 15px; }
        .btn-search { border-radius: 0 20px 20px 0; background-color: var(--primary-color); border: none; color: black; padding: 8px 15px; }

        /* Icon Giỏ hàng & Tài khoản */
        .nav-icons { display: flex; align-items: center; gap: 20px; color: white; }
        .nav-icons a { color: white; text-decoration: none; font-size: 0.9rem; cursor: pointer; }
        .cart-badge { background: #ff4757; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; position: absolute; top: -5px; right: -10px; }

        /* THANH PHÂN LOẠI DANH MỤC */
        .category-bar { background: #1a1a1a; padding: 10px 0; text-align: center; }
        .category-btn { color: white; border: 1px solid #444; margin: 0 5px; border-radius: 20px; transition: 0.3s; padding: 6px 15px; font-size: 0.9rem; }
        .category-btn:hover, .category-btn.active { background: var(--primary-color); color: black; border-color: var(--primary-color); font-weight: bold; }

        /* Banner chính */
        .hero-banner { 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1593640408182-31c70c8268f5?auto=format&fit=crop&w=1920'); 
            background-size: cover; 
            background-position: center;
            padding: 100px 0; 
            color: white; 
            text-align: center;
        }

        /* Card sản phẩm */
        .pc-card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s; height: 100%; background: white; }
        .pc-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,210,255,0.2); }
        .price { color: #ff4757; font-weight: bold; font-size: 1.1rem; }
        .btn-add-cart { background: var(--primary-color); color: black; font-weight: bold; width: 100%; border-radius: 8px; border: none; padding: 8px; }
        
        /* Hiệu ứng ẩn sản phẩm */
        .product-item.hidden { display: none; }
    </style>
</head>

            </div>
            <div>
                <i class="fas fa-map-marker-alt"></i> Địa chỉ: <b>Khu vực Thới Hòa 1, Xã Thới Thuận, Phường Thốt Nốt, Thành phố Cần Thơ</b>

    </div>

        // --- HÀM HIỂN THỊ SẢN PHẨM ---
        function displayProducts(productsToDisplay) {
            const productList = document.getElementById('productList');
            productList.innerHTML = ''; // Xóa sạch lưới sản phẩm cũ

            productsToDisplay.forEach(p => {
                const productCard = `
                    <div class="col-6 col-md-3">
                        <div class="card pc-card p-2 text-center">
                            <img src="${p.img}" alt="${p.name}" class="card-img-top mb-2" style="height: 180px; object-fit: contain;">
                            <div class="card-body p-1 text-center">
                                <h6 class="fw-bold product-name" style="font-size: 0.85rem; height: 2.7rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${p.name}</h6>
                                <p class="price mb-2">${p.price}</p>
                                <button class="btn btn-add-cart btn-sm" onclick="alert('Đã thêm sản phẩm vào giỏ!');">THÊM VÀO GIỎ</button>
                            </div>
                        </div>
                    </div>
                `;
                productList.insertAdjacentHTML('beforeend', productCard);
            });
        }

        // --- HÀM PHÂN LOẠI DANH MỤC ---
        function filterCategory(category) {
            // Cập nhật giao diện nút phân loại
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Cập nhật tiêu đề danh mục
            const categoryTitle = document.getElementById('categoryTitle');
            const categoryNames = { all: 'Tất cả sản phẩm', vga: 'Card Đồ Họa (RTX)', monitor: 'Màn hình ASUS', gear: 'Phím & Chuột', cpu: 'Intel Core i3-i9' };
            categoryTitle.innerText = categoryNames[category];

            // Hiển thị sản phẩm theo danh mục đã chọn
            if (category === 'all') {
                displayProducts(products);
            } else {
                const filteredProducts = products.filter(p => p.cat === category);
                displayProducts(filteredProducts);
            }
        }

        // --- TÍNH NĂNG TÌM KIẾM ---
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            const filteredProducts = products.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filteredProducts);
        });

        // Chạy lần đầu hiển thị tất cả
        displayProducts(products);
    </script>
