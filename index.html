<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINZ PC - Hi-End Computer Store</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { 
            --primary-color: #00d2ff; 
            --dark-bg: #0d0d0d; 
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; }
        
        /* NAVBAR MỚI: CÓ LOGO TRÒN & XÓA ADMIN MODE */
        .navbar { background-color: var(--dark-bg) !important; border-bottom: 2px solid var(--primary-color); padding: 10px 0; }
        .navbar-brand { color: white !important; font-weight: 800; font-size: 1.6rem; letter-spacing: 1px; }
        .logo-circle { width: 45px; height: 45px; border: 2px solid var(--primary-color); object-fit: cover; margin-right: 12px; }

        /* BANNER SHINZ PC TỪ HÌNH BẠN GỬI */
        .hero-banner { 
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), 
                        url('https://lh3.googleusercontent.com/d/1O0KxN_C3-e9K_ZlGqL1C7A9vY_T7P8G1'); /* Link ảnh banner của bạn */
            background-size: cover; 
            background-position: center;
            padding: 140px 0; 
            color: white; 
            text-align: center;
        }
        .hero-banner h1 { 
            font-size: 4.5rem; 
            font-weight: 900; 
            text-shadow: 0 0 20px rgba(0,210,255,0.7);
            margin-bottom: 15px;
        }

        /* Card sản phẩm */
        .pc-card { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.3s; overflow: hidden; height: 100%; }
        .pc-card:hover { transform: translateY(-10px); box-shadow: 0 10px 25px rgba(0,210,255,0.3); }
        .price { color: #ff4757; font-size: 1.3rem; font-weight: bold; }
        .btn-order { background-color: var(--primary-color); color: black; font-weight: bold; border-radius: 8px; transition: 0.3s; }
        .btn-order:hover { background-color: white; color: var(--primary-color); border: 1px solid var(--primary-color); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container d-flex align-items-center">
            <img src="https://lh3.googleusercontent.com/d/1vS8u_yU1S_zY7L9e-L3lGqJv-N_tH8-I" alt="Logo" class="rounded-circle logo-circle">
            <a class="navbar-brand" href="#">SHINZ PC</a>
        </div>
    </nav>

    <header class="hero-banner">
        <div class="container">
            <h1>SHINZ PC</h1>
            <p class="fs-4 fw-light">COMPONENTS & GAMING GEAR ACCESSORIES</p>
            <div class="mt-4">
                <a href="#store" class="btn btn-order px-5 py-2 fs-5 shadow">MUA NGAY</a>
            </div>
        </div>
    </header>

    <div class="container my-5" id="store">
        <h2 class="text-center mb-5 fw-bold">DANH MỤC SẢN PHẨM</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card pc-card">
                    <img src="https://images.unsplash.com/photo-1591488320449-011701bb6704?auto=format&fit=crop&w=500" class="card-img-top">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">VGA RTX 4090 Rog Strix</h5>
                        <p class="price">45.990.000đ</p>
                        <button class="btn btn-order w-100" data-bs-toggle="modal" data-bs-target="#orderModal" data-product="VGA RTX 4090">MUA NGAY</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card pc-card">
                    <img src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=500" class="card-img-top">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">CPU i9-14900K High-End</h5>
                        <p class="price">15.500.000đ</p>
                        <button class="btn btn-order w-100" data-bs-toggle="modal" data-bs-target="#orderModal" data-product="CPU i9-14900K">MUA NGAY</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card pc-card">
                    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=500" class="card-img-top">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Bàn Phím Cơ Custom RGB</h5>
                        <p class="price">3.200.000đ</p>
                        <button class="btn btn-order w-100" data-bs-toggle="modal" data-bs-target="#orderModal" data-product="Bàn Phím Cơ Custom">MUA NGAY</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Thông Tin Đặt Hàng</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="orderForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Sản phẩm:</label>
                            <input type="text" class="form-control bg-light" id="productName" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Họ tên khách hàng:</label>
                            <input type="text" class="form-control" placeholder="Nhập tên của bạn" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại:</label>
                            <input type="tel" class="form-control" placeholder="09xx xxx xxx" required>
                        </div>
                        <button type="submit" class="btn btn-order w-100 py-2 mt-2">XÁC NHẬN ĐƠN HÀNG</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0">&copy; 2026 SHINZ PC - Website Quản Lý Cửa Hàng</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const orderModal = document.getElementById('orderModal');
        orderModal.addEventListener('show.bs.modal', event => {
            const button = event.relatedTarget;
            const product = button.getAttribute('data-product');
            const modalInput = orderModal.querySelector('#productName');
            modalInput.value = product;
        });

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Cảm ơn bạn! Đơn hàng đã được hệ thống ghi nhận thành công.');
            location.reload();
        });
    </script>
</body>
</html>
