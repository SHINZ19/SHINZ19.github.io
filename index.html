<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINZ PC - Hi-End Gaming Center</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { 
            --primary-color: #00d2ff; /* Màu xanh Cyan giống logo */
            --dark-bg: #0d0d0d; 
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; }
        
        /* NAVBAR CHÍNH THỨC CÓ LOGO CHỮ Z - Admin Mode đã xóa */
        .navbar { 
            background-color: var(--dark-bg) !important; 
            border-bottom: 2px solid var(--primary-color); 
            padding: 8px 0; 
        }
        .navbar-brand { 
            color: white !important; 
            font-weight: 800; 
            font-size: 1.6rem; 
            letter-spacing: 1.5px; 
            display: flex;
            align-items: center;
            text-transform: uppercase;
        }
        
        /* Hiệu ứng cho logo tròn chữ Z của bạn */
        .logo-z-tech { 
            width: 50px; 
            height: 50px; 
            border: 2px solid var(--primary-color); 
            border-radius: 50%;
            object-fit: cover; 
            margin-right: 15px; 
            box-shadow: 0 0 10px rgba(0,210,255,0.7);
        }

        /* Banner chính chuyên nghiệp */
        .hero-banner { 
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1593640408182-31c70c8268f5?auto=format&fit=crop&w=1920&q=80'); 
            background-size: cover; 
            background-position: center;
            padding: 130px 0; 
            color: white; 
            text-align: center;
        }
        .hero-banner h1 { 
            font-size: 4.8rem; 
            font-weight: 900; 
            text-shadow: 0 0 25px var(--primary-color);
            margin-bottom: 10px;
        }

        /* Card sản phẩm PC */
        .pc-card { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.3s; overflow: hidden; height: 100%; }
        .pc-card:hover { transform: translateY(-10px); box-shadow: 0 10px 25px rgba(0,210,255,0.3); }
        .price { color: #ff4757; font-size: 1.3rem; font-weight: bold; }
        .btn-order { background-color: var(--primary-color); color: black; font-weight: bold; border-radius: 8px; transition: 0.3s; }
        .btn-order:hover { background-color: white; color: var(--primary-color); border: 1px solid var(--primary-color); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="logo.jpg" alt="Logo Z" class="logo-z-tech">
                <span>SHINZ PC</span>
            </a>
        </div>
    </nav>

    <header class="hero-banner">
        <div class="container">
            <h1>SHINZ PC</h1>
            <p class="fs-4 fw-light">COMPONENTS & GAMING GEAR ACCESSORIES</p>
            <div class="mt-4">
                <a href="#store" class="btn btn-order px-5 py-2 fs-5 shadow">MUA NGAY</a>
            </div>
        </div>
    </header>

    <div class="container my-5" id="store">
        <h2 class="text-center mb-5 fw-bold">DANH MỤC SẢN PHẨM</h2>
        <div class="row g-4 text-center">
            
            <div class="col-md-4">
                <div class="card pc-card">
                    <img src="https://images.unsplash.com/photo-1591488320449-011701bb6704?auto=format&fit=crop&w=500" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">VGA RTX 4090 Rog Strix</h5>
                        <p class="price">45.990.000đ</p>
                        <button class="btn btn-order w-100" data-bs-toggle="modal" data-bs-target="#orderModal" data-product="VGA RTX 4090 Rog Strix">ĐẶT MUA</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card pc-card">
                    <img src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=500" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">CPU i9-14900K High-End</h5>
                        <p class="price">15.500.000đ</p>
                        <button class="btn btn-order w-100" data-bs-toggle="modal" data-bs-target="#orderModal" data-product="CPU i9-14900K High-End">ĐẶT MUA</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card pc-card">
                    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=500" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Bàn Phím Cơ Custom RGB</h5>
                        <p class="price">3.200.000đ</p>
                        <button class="btn btn-order w-100" data-bs-toggle="modal" data-bs-target="#orderModal" data-product="Bàn Phím Cơ Custom RGB">ĐẶT MUA</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Thông Tin Đặt Hàng</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="orderForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Sản phẩm:</label>
                            <input type="text" class="form-control bg-light fw-bold" id="productName" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tên khách hàng:</label>
                            <input type="text" class="form-control" placeholder="Nhập tên của bạn" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại:</label>
                            <input type="tel" class="form-control" placeholder="09xx xxx xxx" required>
                        </div>
                        <button type="submit" class="btn btn-order w-100 py-2 mt-2">XÁC NHẬN ĐƠN HÀNG</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0">© 2026 SHINZ PC - Website Quản Lý Cửa Hàng</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const orderModal = document.getElementById('orderModal');
        orderModal.addEventListener('show.bs.modal', event => {
            const button = event.relatedTarget;
            const product = button.getAttribute('data-product');
            const modalInput = orderModal.querySelector('#productName');
            modalInput.value = product;
        });

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Cảm ơn bạn! Đơn hàng linh kiện PC của bạn đã được ghi nhận thành công.');
            location.reload();
        });
    </script>
</body>
</html>
