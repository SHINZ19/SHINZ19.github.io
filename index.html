<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINZ PC - Hi-End PC Store</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary-color: #00d2ff; --dark-bg: #0d0d0d; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        
        /* THANH THÔNG TIN LIÊN HỆ TRÊN CÙNG (TOP BAR) */
        .top-bar { 
            background-color: #1a1a1a; 
            color: white; 
            font-size: 0.85rem; 
            padding: 8px 0; 
            border-bottom: 1px solid #333;
        }
        .top-bar i { color: var(--primary-color); margin-right: 5px; }
        .top-logo-small { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--primary-color); margin-right: 10px; }

        /* NAVBAR CHÍNH */
        .navbar { background-color: var(--dark-bg) !important; border-bottom: 2px solid var(--primary-color); padding: 10px 0; }
        .navbar-brand { color: white !important; font-weight: 800; font-size: 1.6rem; display: flex; align-items: center; }
        .logo-z-tech { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary-color); object-fit: cover; margin-right: 12px; }

        /* TÌM KIẾM, GIỎ HÀNG, TÀI KHOẢN */
        .search-container { max-width: 350px; width: 100%; margin: 0 20px; }
        .search-input { border-radius: 20px 0 0 20px; border: none; padding: 8px 15px; }
        .btn-search { border-radius: 0 20px 20px 0; background-color: var(--primary-color); border: none; color: black; }
        .nav-icons { display: flex; align-items: center; gap: 20px; color: white; }
        .nav-icons a { color: white; text-decoration: none; font-size: 0.9rem; cursor: pointer; }
        .cart-badge { background: #ff4757; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; position: absolute; top: -5px; right: -10px; }

        /* PHÂN LOẠI DANH MỤC */
        .category-bar { background: #1a1a1a; padding: 10px 0; text-align: center; }
        .category-btn { color: white; border: 1px solid #444; margin: 0 5px; border-radius: 20px; transition: 0.3s; padding: 6px 15px; font-size: 0.9rem; }
        .category-btn:hover, .category-btn.active { background: var(--primary-color); color: black; border-color: var(--primary-color); font-weight: bold; }

        /* CARD SẢN PHẨM */
        .pc-card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s; height: 100%; background: white; }
        .pc-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,210,255,0.2); }
        .price { color: #ff4757; font-weight: bold; font-size: 1.1rem; }
        .btn-add-cart { background: var(--primary-color); color: black; font-weight: bold; width: 100%; border-radius: 8px; border: none; padding: 8px; }
    </style>
</head>
<body>

    <div class="top-bar d-none d-lg-block">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <img src="logo.jpg" alt="Logo" class="top-logo-small">
                <span class="me-4"><i class="fas fa-phone-alt"></i> Hotline: <b>0392966091</b></span>
                <span class="me-4"><i class="fas fa-clock"></i> Mở cửa: <b>7:00 - 22:00</b></span>
            </div>
            <div>
                <i class="fas fa-map-marker-alt"></i> Địa chỉ: <b>Khu vực Thới Hòa 1, Thới Thuận, Thốt Nốt, Cần Thơ</b>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="logo.jpg" alt="Logo Z" class="logo-z-tech">
                <span>SHINZ PC</span>
            </a>

            <div class="search-container d-flex mx-auto">
                <input type="text" id="searchInput" class="form-control search-input" placeholder="Tìm linh kiện PC...">
                <button class="btn btn-search"><i class="fas fa-search"></i></button>
            </div>

            <div class="nav-icons">
                <a data-bs-toggle="modal" data-bs-target="#accountModal"><i class="fas fa-user-circle fa-lg"></i> Tài khoản</a>
                <a class="position-relative"><i class="fas fa-shopping-basket fa-lg"></i> Giỏ hàng <span class="cart-badge" id="cart-count">0</span></a>
            </div>
        </div>
    </nav>

    <div class="category-bar">
        <div class="container">
            <button class="btn category-btn active" onclick="filterCategory('all')">Tất cả</button>
            <button class="btn category-btn" onclick="filterCategory('vga')">Card Đồ Họa (RTX)</button>
            <button class="btn category-btn" onclick="filterCategory('monitor')">Màn hình ASUS</button>
            <button class="btn category-btn" onclick="filterCategory('gear')">Phím & Chuột</button>
            <button class="btn category-btn" onclick="filterCategory('cpu')">Intel Core i3-i9</button>
        </div>
    </div>

    <div class="container my-5">
        <h3 id="categoryTitle" class="fw-bold mb-4 text-uppercase">Tất cả sản phẩm</h3>
        <div id="noResults" class="text-center text-muted d-none"><h5>Không tìm thấy sản phẩm.</h5></div>
        <div class="row g-4 text-center" id="productList">
            </div>
    </div>

    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0 text-muted">© 2026 SHINZ PC - Hi-End Gaming Center</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // DỮ LIỆU SẢN PHẨM (Mẫu phân đoạn)
        const allProducts = [
            // VGA
            { cat: 'vga', name: 'VGA MSI RTX 3050 Ventus 8G', price: '6.500.000đ', img: 'https://via.placeholder.com/200x150?text=VGA+RTX' },
            { cat: 'vga', name: 'VGA ASUS RTX 4060 Dual 8GB', price: '8.900.000đ', img: 'https://via.placeholder.com/200x150?text=VGA+RTX' },
            { cat: 'vga', name: 'VGA ROG Strix RTX 4090 OC 24GB', price: '55.000.000đ', img: 'https://via.placeholder.com/200x150?text=RTX+4090' },
            // MONITOR
            { cat: 'monitor', name: 'Màn hình ASUS VY249HE 75Hz', price: '2.800.000đ', img: 'https://via.placeholder.com/200x150?text=ASUS+MONITOR' },
            { cat: 'monitor', name: 'Màn hình Cong ASUS TUF 165Hz', price: '5.200.000đ', img: 'https://via.placeholder.com/200x150?text=CURVED+MONITOR' },
            { cat: 'monitor', name: 'Màn hình ASUS ROG 540Hz', price: '25.000.000đ', img: 'https://via.placeholder.com/200x150?text=540HZ' },
            // GEAR
            { cat: 'gear', name: 'Chuột Logitech G102 Gen2', price: '399.000đ', img: 'https://via.placeholder.com/200x150?text=LOGITECH' },
            { cat: 'gear', name: 'Bàn phím cơ ATK68 Magnetic', price: '1.850.000đ', img: 'https://via.placeholder.com/200x150?text=ATK+GEAR' },
            // CPU
            { cat: 'cpu', name: 'CPU Intel Core i3-12100F', price: '2.200.000đ', img: 'https://via.placeholder.com/200x150?text=CORE+I3' },
            { cat: 'cpu', name: 'CPU Intel Core i9-14900K', price: '15.900.000đ', img: 'https://via.placeholder.com/200x150?text=CORE+I9' },
        ];

        function displayProducts(data) {
            const list = document.getElementById('productList');
            list.innerHTML = data.map(p => `
                <div class="col-6 col-md-3">
                    <div class="card pc-card p-2">
                        <img src="${p.img}" class="card-img-top rounded mb-2">
                        <div class="card-body p-1">
                            <h6 class="fw-bold product-name" style="font-size: 0.85rem;">${p.name}</h6>
                            <p class="price mb-2">${p.price}</p>
                            <button class="btn btn-add-cart btn-sm" onclick="alert('Đã thêm vào giỏ!')">MUA NGAY</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            const filtered = category === 'all' ? allProducts : allProducts.filter(p => p.cat === category);
            displayProducts(filtered);
            document.getElementById('categoryTitle').innerText = category;
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filtered);
        });

        displayProducts(allProducts);
    </script>
</body>
</html>
