<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINZ STORE - Premium Vaping</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #ffc107; /* Màu vàng Gold */
            --dark-bg: #1a1a1a;       /* Màu nền đen */
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f4f4;
        }

        /* Navbar đen sang trọng */
        .navbar {
            background-color: var(--dark-bg) !important;
            border-bottom: 2px solid var(--primary-color);
        }
        .navbar-brand, .nav-link {
            color: white !important;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .nav-link:hover {
            color: var(--primary-color) !important;
        }

        /* Banner cực ngầu */
        .hero-banner {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1555616635-640b71bdb181?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 120px 0;
            text-align: center;
        }
        .hero-banner h1 {
            font-size: 3.5rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        /* Card sản phẩm */
        .product-card {
            background: var(--card-bg);
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .product-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .price-tag {
            color: #d9534f;
            font-weight: 800;
            font-size: 1.3rem;
        }
        .btn-buy {
            background-color: var(--dark-bg);
            color: white;
            border-radius: 25px;
            padding: 8px 25px;
            border: 2px solid var(--dark-bg);
            transition: 0.3s;
        }
        .btn-buy:hover {
            background-color: transparent;
            color: var(--dark-bg);
        }

        /* Nút Zalo nổi */
        .zalo-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0084ff;
            color: white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            text-align: center;
            line-height: 60px;
            font-size: 30px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }
    </style>
</head>
<body>
